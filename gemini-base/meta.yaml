# This meta-package is used for configuration control of the base conda package
# versions used internally at Gemini, besides Gemini IRAF & DRAGONS.
#
# Using OS-specific "builds" allows for variation in the particular package
# builds available on each one.
#
# This is a third version for conda_forge + IRAF on Python 3, with various
# major updates such as Python 3.14, NumPy 2, Qt6 & AstroPy 8, after a long
# delay between versions. It primarily includes dependencies needed to run the
# QA pipeline, FIRE, Gemini IRAF, PyGacq (once updated for NumPy2 & Qt6) and
# potentially SOS DR scripts, equivalent to (on Linux)
#   iraf-all pyraf-all ds9 dragons gemaux_python gemini-sciops-deps psycopg
#   ghostscript toml
# or (on MacOS)
#   ds9 dragons gemaux_python gemini-sciops-deps psycopg ghostscript toml,
# but with gemini packages removed (retaining the dependencies they install).
# If additional packages are needed by internal users, they will probably get
# installed from gemini-common into a separate env for that purpose.

build:
  number: '0'
package:
  name: gemini-base
  version: 7.0
about:
  license: BSD
  summary: Base AstroConda installation for internal use at Gemini
requirements:
  host:
  - python  # needs to be in the recipe for Python-specific builds
